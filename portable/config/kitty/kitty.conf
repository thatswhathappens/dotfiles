font_family   JetBrains Mono NF 
font_size        16.0

background_opacity 0.8
# kitty only blurs the background on Wayland compositors that support it
background_blur   20

foreground #bfbdb6
background #101010

cursor            #bfbdb6
cursor_text_color #0b0e14

selection_foreground #bfbdb6
selection_background #1b3a5b

# normal
color0  #1e232b
color1  #ea6c73
color2  #7fd962
color3  #f9af4f
color4  #53bdfa
color5  #cda1fa
color6  #90e1c6
color7  #c7c7c7

# bright
color8  #686868
color9  #f07178
color10 #aad94c
color11 #ffb454
color12 #59c2ff
color13 #d2a6ff
color14 #95e6cb
color15 #ffffff

map shift+enter send_text all \x1b\r
confirm_os_window_close 0
